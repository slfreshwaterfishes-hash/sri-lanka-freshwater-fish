<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Halfbeaks & Gars</title>

    <link rel="stylesheet" href="../style.css">
    <style>
        /* Enlarged cards, image heights, and text sizes for a 4-item grid */
        .db-card {
            padding: 22px;
            border-radius: 16px;
        }

        .db-card img {
            height: 220px; /* Increased image height to give a larger presence */
            object-fit: cover;
            border-radius: 12px;
        }

        .db-card .text {
            padding-top: 14px;
        }

        .db-card .text .en {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .db-card .text .si {
            font-size: 20px;
            margin-bottom: 2px;
        }

        .db-card .text .sc {
            font-size: 16px;
            font-style: italic;
        }
    </style>
</head>

<body>

<header>
    <div class="container">
        <div class="title">Fish Database</div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="../index.html">Back</a>
        </nav>
    </div>
</header>

<section class="database snake-page">

    <h2>Halfbeaks & Gars</h2>

    <p class="db-sub">Halfbeak and Gar species of Sri Lanka</p>

    <div class="db-grid">

        <!-- 1: Estuarine Halfbeak -->
        <a href="../species/gars/zenarchopterus-dispar.html" class="fish-link">
            <div class="db-card">
                <img src="/images/gars/zenarchopterus-dispar.jpg" alt="Estuarine Halfbeak">
                <div class="text">
                    <div class="si">මොරැල්ලා</div>
                    <div class="en">Estuarine Halfbeak</div>
                    <div class="sc">Zenarchopterus dispar</div>
                </div>
            </div>
        </a>

        <!-- 2: Freshwater Needlefish -->
        <a href="../species/gars/xenentodon-cancila.html" class="fish-link">
            <div class="db-card">
                <img src="/images/gars/xenentodon-cancila.jpg" alt="Freshwater Needlefish">
                <div class="text">
                    <div class="si">යෝනා</div>
                    <div class="en">Freshwater Needlefish</div>
                    <div class="sc">Xenentodon cancila</div>
                </div>
            </div>
        </a>

        <!-- 3: Congaturi Halfbeak -->
        <a href="../species/gars/hyporhamphus-limbatus.html" class="fish-link">
            <div class="db-card">
                <img src="/images/gars/hyporhamphus-limbatus.jpg" alt="Congaturi Halfbeak">
                <div class="text">
                    <div class="si">මොරැල්ලා</div>
                    <div class="en">Congaturi Halfbeak</div>
                    <div class="sc">Hyporhamphus limbatus</div>
                </div>
            </div>
        </a>

        <!-- 4: Alligator Gar -->
        <a href="../species/gars/atractosteus-spatula.html" class="fish-link">
            <div class="db-card">
                <img src="/images/gars/atractosteus-spactula.jpg" alt="Alligator Gar">
                <div class="text">
                    <div class="si">ඇලිගේටර් ගාර්</div>
                    <div class="en">Alligator Gar</div>
                    <div class="sc">Atractosteus spatula</div>
                </div>
            </div>
        </a>

    </div>

</section>

</body>
</html>
