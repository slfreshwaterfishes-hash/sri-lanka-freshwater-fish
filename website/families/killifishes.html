<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Killifishes - උඩ හඳයන්</title>

    <link rel="stylesheet" href="../style.css">
    <style>
        /* Enlarged cards, image heights, and text sizes for a sparse 3-item grid */
        .db-card {
            padding: 22px;
            border-radius: 16px;
        }

        .db-card img {
            height: 220px; /* Gives the fish images a bigger presence */
            object-fit: cover;
            border-radius: 12px;
        }

        .db-card .text {
            padding-top: 14px;
        }

        .db-card .text .en {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .db-card .text .si {
            font-size: 20px;
            margin-bottom: 2px;
        }

        .db-card .text .sc {
            font-size: 16px;
            font-style: italic;
        }

        /* Styling for Sinhala sub-heading next to main title */
        .si-title {
            font-size: 24px;
            color: #2F6B57;
            font-weight: normal;
            margin-left: 8px;
        }
    </style>
</head>

<body>

<header>
    <div class="container">
        <div class="title">Fish Database</div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="../index.html">Back</a>
        </nav>
    </div>
</header>

<section class="database snake-page">

    <h2>Killifishes <span class="si-title">(උඩ හඳයන්)</span></h2>

    <p class="db-sub">Killifish species of Sri Lanka</p>

    <div class="db-grid">

        <!-- 1: Ceylon Killifish -->
        <a href="../species/killifish/aplocheilus-dayi.html" class="fish-link">
            <div class="db-card">
                <img src="/sri-lanka-freshwater-fish/images/killifish/aplocheilus-dayi1.jpg" alt="Ceylon Killifish">
                <div class="text">
                    <div class="si">උඩ හඳයා</div>
                    <div class="en">Ceylon Killifish</div>
                    <div class="sc">Aplocheilus dayi</div>
                </div>
            </div>
        </a>

        <!-- 2: Werner's Killifish -->
        <a href="../species/killifish/aplocheilus-werneri.html" class="fish-link">
            <div class="db-card">
                <img src="/sri-lanka-freshwater-fish/images/killifish/aplocheilus-werneri1.jpg" alt="Werner's Killifish">
                <div class="text">
                    <div class="si">ඉරි හඳයා</div>
                    <div class="en">Werner's Killifish</div>
                    <div class="sc">Aplocheilus werneri</div>
                </div>
            </div>
        </a>

        <!-- 3: Green Panchax -->
        <a href="../species/killifish/aplocheilus-parvus.html" class="fish-link">
            <div class="db-card">
                <img src="/sri-lanka-freshwater-fish/images/killifish/aplocheilus-parvus1.jpg" alt="Green Panchax">
                <div class="text">
                    <div class="si">කලපු හඳයා</div>
                    <div class="en">Green Panchax</div>
                    <div class="sc">Aplocheilus parvus</div>
                </div>
            </div>
        </a>

    </div>

</section>

</body>
</html>
